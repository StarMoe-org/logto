# StarMoe: build the patched Logto image (branch `starmoe`) and push it to GHCR.
# Build only: nothing is deployed. Logto in production is moved to a new tag by hand.
name: StarMoe image

on:
  push:
    branches: [starmoe]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: starmoe-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./packages/core/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.version }}-starmoe
          cache-from: type=gha,scope=starmoe-image
          cache-to: type=gha,scope=starmoe-image,mode=max
